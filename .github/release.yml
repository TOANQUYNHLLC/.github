# Nhóm nội dung GitHub Release tự tạo theo nhãn của Pull Request.
# Tên nhãn khớp labels.yml của tổ chức.
changelog:
    exclude:
        labels:
            - duplicate
            - invalid
            - wontfix
    categories:
        - title: 💥 Thay đổi phá vỡ tương thích
          labels:
              - breaking change
        - title: 🔐 Bảo mật
          labels:
              - security
        - title: ✨ Tính năng
          labels:
              - enhancement
        - title: 🐛 Sửa lỗi
          labels:
              - bug
              - regression
        - title: ⚡ Hiệu năng
          labels:
              - performance
        - title: 📝 Tài liệu
          labels:
              - documentation
        - title: 📦 Phụ thuộc
          labels:
              - dependencies
              - github_actions
        - title: 🔧 Thay đổi khác
          labels:
              - '*'
