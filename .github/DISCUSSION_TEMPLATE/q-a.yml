title: '[Hỏi đáp] '
body:
    - type: markdown
      attributes:
          value: |
              Đặt câu hỏi về cách sử dụng, cấu hình hoặc hoạt động của dự án. Lỗi rõ ràng hãy tạo Issue **🐛 Báo lỗi**.

              > ⚠️ Không đưa mật khẩu, khóa API, token truy cập, dữ liệu cá nhân, hồ sơ bệnh án hoặc thông tin y tế nhạy cảm vào thảo luận.
              > 🔐 Vấn đề bảo mật: **không** đăng công khai — báo cáo riêng theo [chính sách bảo mật](https://github.com/TOANQUYNHLLC/.github/blob/main/SECURITY.md).

    - type: textarea
      id: question
      attributes:
          label: 📋 CÂU HỎI
          description: Nêu rõ điều cần hỏi hoặc cần hỗ trợ.
      validations:
          required: true

    - type: textarea
      id: research
      attributes:
          label: 🔎 ĐÃ TÌM HIỂU
          description: Tài liệu, Issue hoặc cách đã thử trước khi hỏi.

    - type: input
      id: version
      attributes:
          label: 🏷️ PHIÊN BẢN HOẶC COMMIT

    - type: input
      id: device
      attributes:
          label: 💻 THIẾT BỊ, HỆ ĐIỀU HÀNH VÀ TRÌNH DUYỆT
          placeholder: 'Ví dụ: MacBook, macOS 15, Chrome 130'
