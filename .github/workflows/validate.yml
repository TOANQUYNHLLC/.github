name: Kiểm tra Repository

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: validate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    content:
        name: Liên kết, biểu mẫu, nhãn, cấu hình định dạng và mẫu email
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Kiểm tra nội dung
              run: python3 scripts/validate.py

            - name: Test các script kiểm tra
              run: python3 -m unittest discover -s scripts -p 'test_*.py'

    format:
        name: Định dạng (Prettier, ruff) và ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cài Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false

            - name: Cài thư viện
              run: npm install --no-audit --no-fund

            - name: Prettier
              run: npx prettier --check .

            - name: ESLint
              run: npx eslint .

            - name: Cài ruff (phiên bản trong mise.toml)
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install_args: ruff

            - name: ruff format
              run: ruff format --check scripts

    lint:
        name: Shell script và workflow
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cài shellcheck, actionlint (phiên bản trong mise.toml)
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install_args: shellcheck actionlint

            - name: shellcheck
              run: shellcheck scripts/*.sh .devcontainer/*.sh

            - name: actionlint
              run: actionlint .github/workflows/*.yml workflow-templates/*.yml
