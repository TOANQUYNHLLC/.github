name: Tạo GitHub Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Tạo GitHub Release từ CHANGELOG.md
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Lấy nội dung phát hành
              env:
                  TAG: ${{ github.ref_name }}
              run: python3 scripts/release-notes.py "$TAG" > release-notes.md

            - name: Tạo Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
