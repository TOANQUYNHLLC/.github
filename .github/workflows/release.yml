name: Tạo GitHub Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ; lượt chạy trên nhánh chính luôn chạy hết.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    release:
        name: Tạo GitHub Release từ CHANGELOG.md
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write # tạo GitHub Release từ tag
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Lấy nội dung phát hành
              env:
                  TAG: ${{ github.ref_name }}
              run: python3 scripts/release-notes.py "$TAG" > release-notes.md

            - name: Tạo Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
