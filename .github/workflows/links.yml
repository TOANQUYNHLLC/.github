name: Kiểm Tra Liên Kết

on:
    schedule:
        - cron: '0 1 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    links:
        name: Kiểm Tra Liên Kết
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Kiểm tra liên kết
              run: python3 scripts/check-external-links.py
