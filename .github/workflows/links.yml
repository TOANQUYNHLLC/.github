name: Kiểm tra liên kết

on:
    schedule:
        - cron: '0 1 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ; lượt chạy trên nhánh chính luôn chạy hết.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    links:
        name: Kiểm tra liên kết
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Kiểm tra liên kết
              run: python3 scripts/check-external-links.py

            - name: Kiểm tra GitHub chấp nhận biểu mẫu
              run: python3 scripts/check-github-forms.py

            - name: Kiểm tra công cụ trong mise.toml có bản mới
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 scripts/check-tool-versions.py
