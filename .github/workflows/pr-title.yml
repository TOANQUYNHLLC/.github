name: Kiểm tra tiêu đề Pull Request

on:
    pull_request:
        types:
            - opened
            - edited
            - reopened
            - synchronize

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ; lượt chạy trên nhánh chính luôn chạy hết.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    title:
        name: Kiểm tra tiêu đề Pull Request
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Kiểm tra tiêu đề
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: scripts/check-pr-title.sh "$PR_TITLE"
