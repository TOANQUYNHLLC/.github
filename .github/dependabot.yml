# Giữ các GitHub Action (đang ghim theo commit SHA) và công cụ Node.js (Prettier, ESLint) luôn được cập nhật.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      labels:
          - dependencies
          - github_actions
      commit-message:
          prefix: chore

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      labels:
          - dependencies
      commit-message:
          prefix: chore
      groups:
          # Gộp mọi bản cập nhật công cụ phát triển vào một Pull Request mỗi tháng.
          dev-tools:
              patterns:
                  - '*'
