# Giữ các GitHub Action (đang ghim theo commit SHA) và công cụ Node.js (Prettier) luôn được cập nhật.
# cooldown: chờ 7 ngày sau khi một phiên bản phát hành mới đề xuất (tránh gói độc vừa phát hành);
# không áp dụng cho cập nhật bảo mật.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - github_actions
      commit-message:
          prefix: chore

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - javascript
      commit-message:
          prefix: chore
      groups:
          # Gộp mọi bản cập nhật công cụ phát triển vào một Pull Request mỗi tháng.
          dev-tools:
              patterns:
                  - '*'
