name: ❓ Câu hỏi hoặc cần hỗ trợ
description: Yêu cầu hỗ trợ cần theo dõi xử lý về cách sử dụng, cấu hình hoặc hoạt động của dự án
title: '[Câu hỏi] '
labels:
    - question
    - needs triage
body:
    - type: markdown
      attributes:
          value: |
              Cảm ơn bạn đã đặt câu hỏi cho dự án.

              Dùng Issue này khi yêu cầu hỗ trợ cần được theo dõi xử lý, hoặc repository chưa bật Discussions. Với câu hỏi hướng dẫn và trao đổi chung, dùng mục Hỏi đáp trong Discussions của repository nếu đã bật. Xem [hướng dẫn chọn kênh hỗ trợ](https://github.com/TOANQUYNHLLC/.github/blob/main/SUPPORT.md).

              > ⚠️ Không đưa mật khẩu, khóa API, token truy cập, dữ liệu cá nhân, hồ sơ bệnh án hoặc thông tin y tế nhạy cảm vào Issue.
              > 🔐 Vấn đề bảo mật: **không** tạo Issue công khai — báo cáo riêng theo [chính sách bảo mật](https://github.com/TOANQUYNHLLC/.github/blob/main/SECURITY.md).

    - type: textarea
      id: question
      attributes:
          label: 📋 CÂU HỎI
          description: Nêu rõ điều cần hỏi hoặc cần hỗ trợ.
      validations:
          required: true

    - type: textarea
      id: research
      attributes:
          label: 🔎 ĐÃ TÌM HIỂU
          description: Tài liệu, Issue hoặc cách đã thử trước khi hỏi.

    - type: input
      id: repository
      attributes:
          label: 📁 DỰ ÁN / REPOSITORY
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: 🏷️ PHIÊN BẢN HOẶC COMMIT

    - type: dropdown
      id: environment
      attributes:
          label: 🖥️ MÔI TRƯỜNG
          options:
              - Phát triển
              - Kiểm thử
              - Production
              - Không áp dụng

    - type: checkboxes
      id: checklist
      attributes:
          label: ✅ CHECKLIST
          options:
              - label: Tôi đã tìm kiếm và không thấy Issue nào trùng lặp.
                required: true
              - label: Tôi không đưa mật khẩu, khóa API, token truy cập hoặc thông tin bảo mật vào Issue.
                required: true
              - label: Tôi không đưa dữ liệu cá nhân, hồ sơ bệnh án hoặc thông tin y tế nhạy cảm vào Issue.
                required: true
