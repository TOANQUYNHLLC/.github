title: '[Hỏi đáp] '
body:
    - type: markdown
      attributes:
          value: |
              Đặt câu hỏi về cách sử dụng, cấu hình hoặc hoạt động của dự án. Lỗi rõ ràng hãy tạo Issue **🐛 Báo lỗi**; vấn đề bảo mật làm theo `SECURITY.md`.

              > ⚠️ Không đưa mật khẩu, khóa API, token truy cập, dữ liệu cá nhân, hồ sơ bệnh án hoặc thông tin y tế nhạy cảm vào thảo luận.

    - type: textarea
      id: question
      attributes:
          label: ❓ CÂU HỎI
      validations:
          required: true

    - type: textarea
      id: tried
      attributes:
          label: 🔍 ĐÃ THỬ NHỮNG GÌ
          description: Tài liệu đã đọc, lệnh đã chạy, kết quả nhận được.
      validations:
          required: false

    - type: input
      id: environment
      attributes:
          label: 🖥️ MÔI TRƯỜNG
          description: Hệ điều hành, trình duyệt hoặc thiết bị, phiên bản ứng dụng.
      validations:
          required: false
