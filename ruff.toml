# Formatter chính thức cho Python: ruff format — thụt lề bằng tab, độ rộng 4.
line-length = 100
indent-width = 4

[format]
indent-style = "tab"
line-ending = "lf"
quote-style = "single"

[lint]
# Ngoài bộ mặc định (E, F): lỗi logic hay gặp (B), viết gọn (C4, SIM), cú pháp Python mới (UP), hiệu năng
# vòng lặp (PERF), cảnh báo pylint (PLW) và luật riêng của ruff (RUF).
extend-select = ["B", "C4", "UP", "SIM", "PERF", "PLW", "RUF"]
# Thông báo tiếng Việt dùng dấu gạch ngang "–" có chủ ý.
ignore = ["RUF001"]
