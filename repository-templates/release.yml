# Mẫu nhóm nội dung GitHub Release tự tạo theo nhãn — chép vào .github/release.yml của repository.
# Tên nhãn khớp labels.yml của tổ chức.
changelog:
    exclude:
        labels:
            - duplicate
            - invalid
            - wontfix
    categories:
        - title: 🔐 Bảo mật
          labels:
              - security
        - title: ✨ Tính năng
          labels:
              - enhancement
        - title: 🐛 Sửa lỗi
          labels:
              - bug
        - title: 📝 Tài liệu
          labels:
              - documentation
        - title: 📦 Phụ thuộc
          labels:
              - dependencies
              - github_actions
        - title: 🔧 Thay đổi khác
          labels:
              - '*'
