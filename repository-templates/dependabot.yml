# Mẫu Dependabot — chép vào .github/dependabot.yml của repository.
# Giữ lại các ecosystem dự án dùng, xóa phần còn lại; "directory" là thư mục chứa tệp khai báo phụ thuộc.
# cooldown: chờ 7 ngày sau khi một phiên bản phát hành mới đề xuất (tránh gói độc vừa phát hành);
# không áp dụng cho cập nhật bảo mật.
# Tài liệu: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
    # GitHub Actions — mọi repository có workflow nên giữ mục này.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - github_actions
      commit-message:
          prefix: chore

    # Node.js — package.json
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - javascript
      commit-message:
          prefix: chore
      groups:
          # Gộp bản cập nhật minor/patch vào một Pull Request; bản major tách riêng để đánh giá kỹ.
          minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    # Python — requirements.txt, pyproject.toml
    - package-ecosystem: pip
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - python
      commit-message:
          prefix: chore

    # Go — go.mod
    - package-ecosystem: gomod
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - go
      commit-message:
          prefix: chore

    # Docker — Dockerfile
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - docker
      commit-message:
          prefix: chore
