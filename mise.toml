# Phiên bản công cụ — nguồn duy nhất (ADR 0008). ruff, ShellCheck, actionlint dùng ở máy cục bộ, Dev Container và CI
# (jdx/mise-action); Python chỉ cho máy cục bộ — CI dùng python3 của runner, Dev Container dùng Python của image.
# Cài mise (https://mise.jdx.dev) rồi chạy: mise install
# Node.js lấy từ .nvmrc (dùng chung với actions/setup-node); thư viện Node.js ghi trong package.json.
[tools]
python = "3.14"
ruff = "0.16.10"
shellcheck = "0.11.0"
actionlint = "1.7.12"

[settings]
idiomatic_version_file_enable_tools = ["node"]
