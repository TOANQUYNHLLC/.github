# Cấu hình yamllint cho workflow, biểu mẫu Issue và labels.yml.
extends: default

# Bỏ qua các thư mục đã có trong .gitignore (.history/, …).
ignore-from-file: .gitignore

rules:
    document-start: disable
    line-length: disable
    truthy:
        check-keys: false
    indentation:
        spaces: 4
        indent-sequences: consistent
