name: Gắn nhãn Pull Request

on:
    # Workflow của nhánh đích có quyền gắn nhãn cho Pull Request từ fork.
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ.
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label:
        name: Gắn nhãn theo branch và tệp thay đổi
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
            pull-requests: write # gắn nhãn theo .github/labeler.yml
        steps:
            # Đọc .github/labeler.yml của nhánh đích qua API; không checkout hay chạy mã của Pull Request.
            - name: Gắn nhãn
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
