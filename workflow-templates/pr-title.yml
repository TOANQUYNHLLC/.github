name: Kiểm tra tiêu đề Pull Request

on:
    pull_request:
        types:
            - opened
            - edited
            - reopened
            - synchronize

permissions:
    contents: read

jobs:
    title:
        name: Kiểm tra tiêu đề Pull Request
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Kiểm tra tiêu đề
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
                  if [[ "$PR_TITLE" =~ $pattern ]]; then
                      echo "Tiêu đề hợp lệ: $PR_TITLE"
                  else
                      echo "::error::Tiêu đề Pull Request phải theo dạng '<loại>: <mô tả>' với loại là feat, fix, docs, style, refactor, perf, test, build, ci, chore hoặc revert — xem CONTRIBUTING.md. Tiêu đề hiện tại: $PR_TITLE"
                      exit 1
                  fi
