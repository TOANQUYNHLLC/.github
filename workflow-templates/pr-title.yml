name: Kiểm tra tiêu đề Pull Request

on:
    pull_request:
        types:
            - opened
            - edited
            - reopened
            - synchronize

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    title:
        name: Kiểm tra tiêu đề Pull Request
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            # Script dùng chung của tổ chức, ghim theo tag phát hành của TOANQUYNHLLC/.github (Protect Release
            # Tags, Release bất biến): thay đổi trên nhánh chính không tự chạy ở repository này. release.py cập
            # nhật ref khi phát hành bản mới; sửa ref theo bản đã kiểm chứng khi nâng.
            - name: Lấy script của tổ chức
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: TOANQUYNHLLC/.github
                  ref: Stable.v2026.11.010001
                  path: .org
                  persist-credentials: false

            - name: Kiểm tra tiêu đề
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: python3 .org/scripts/conventions.py title "$PR_TITLE"
