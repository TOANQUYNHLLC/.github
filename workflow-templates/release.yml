name: Tạo GitHub Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    # Không chạy chồng: lượt sau chờ lượt trước xong, không hủy.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Tạo GitHub Release từ CHANGELOG.md
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write # tạo GitHub Release từ tag
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Script kiểm tra dùng chung của tổ chức (nhánh chính của TOANQUYNHLLC/.github — được ruleset
            # bảo vệ: Pull Request, phê duyệt, commit có chữ ký); sửa quy ước ở một nơi cho mọi repository.
            - name: Lấy script của tổ chức
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: TOANQUYNHLLC/.github
                  path: .org
                  persist-credentials: false

            # Nội dung lấy từ mục ## [<tag>] của CHANGELOG.md; không có thì GitHub tự tạo từ các Pull Request.
            # Tổ chức bật Immutable releases: sau khi phát hành không thêm, sửa được tệp đính kèm. Cần đính kèm tệp thì
            # tạo bản nháp (--draft), tải tệp lên (gh release upload), rồi phát hành (gh release edit --draft=false).
            - name: Tạo Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: python3 .org/scripts/release.py create "$TAG" --changelog CHANGELOG.md --allow-generated-notes
