name: Tạo GitHub Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    release:
        name: Tạo GitHub Release từ CHANGELOG.md
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Lấy nội dung phát hành từ CHANGELOG.md
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  # Lấy mục "## [<tag>] …" (định dạng Keep a Changelog) tới mục kế tiếp.
                  if [[ -f CHANGELOG.md ]]; then
                      awk -v tag="[$TAG]" '
                          index($0, "## " tag) == 1 { found = 1; next }
                          found && /^## / { exit }
                          found { print }
                      ' CHANGELOG.md > release-notes.md
                  fi
                  if [[ -s release-notes.md ]]; then
                      echo "Dùng nội dung mục [$TAG] trong CHANGELOG.md."
                  else
                      echo "::warning::CHANGELOG.md không có mục [$TAG] — GitHub tự tạo nội dung từ các Pull Request."
                      rm -f release-notes.md
                  fi

            - name: Tạo Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  if [[ -f release-notes.md ]]; then
                      gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
                  else
                      gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
                  fi
