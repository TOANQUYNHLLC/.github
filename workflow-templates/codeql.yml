name: CodeQL

on:
    push:
        branches:
            - $default-branch
    pull_request:
    schedule:
        - cron: '0 3 * * 1'

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ; lượt chạy trên nhánh chính luôn chạy hết.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: Phân tích bảo mật (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                # Sửa theo ngôn ngữ của dự án. Ngôn ngữ thông dịch dùng build-mode "none";
                # ngôn ngữ biên dịch (java-kotlin, csharp, go, c-cpp, swift) dùng "autobuild".
                include:
                    - language: javascript-typescript
                      build-mode: none
                    - language: python
                      build-mode: none
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Khởi tạo CodeQL
              uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}

            - name: Phân tích
              uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  category: '/language:${{ matrix.language }}'
