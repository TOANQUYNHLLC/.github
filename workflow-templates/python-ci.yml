name: Python CI

on:
    push:
        branches:
            - $default-branch
    pull_request:

permissions:
    contents: read

concurrency:
    # Push mới trên cùng Pull Request hủy lượt chạy cũ; lượt chạy trên nhánh chính luôn chạy hết.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: Cài đặt, kiểm tra định dạng và kiểm thử
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cài Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version-file: .python-version

            - name: Cài pip, ruff, pytest
              run: python -m pip install --upgrade pip ruff pytest

            - name: Cài thư viện (requirements.txt)
              if: hashFiles('requirements.txt') != ''
              run: pip install -r requirements.txt

            - name: Cài thư viện phát triển (requirements-dev.txt)
              if: hashFiles('requirements-dev.txt') != ''
              run: pip install -r requirements-dev.txt

            - name: Kiểm tra định dạng (ruff format)
              run: ruff format --check .

            - name: Lint (ruff check)
              run: ruff check .

            # Không có thư mục tests thì bỏ qua kiểm thử.
            - name: Kiểm thử
              if: hashFiles('tests/**') != ''
              run: python -m pytest
