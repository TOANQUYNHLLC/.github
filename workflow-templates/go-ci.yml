name: Go CI

on:
    push:
        branches:
            - $default-branch
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Định dạng, vet, kiểm thử và build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cài Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Kiểm tra định dạng (gofmt)
              run: |
                  unformatted=$(gofmt -l .)
                  if [[ -n "$unformatted" ]]; then
                      echo "::error::Các file chưa chạy gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Kiểm thử
              run: go test -race ./...

            - name: Build
              run: go build ./...
